apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-db
  labels:
    kubernetes.io/service-name: external-db
addressType: IPv4
ports:
- port: 5432
endpoints:
- addresses:
  - 192.168.1.100 # Can be IP
  - db-production-aws.com # Or DNS name
  - db-other-namespace.svc.cluster.local # Or K8s internal