apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app.kubernetes.io/name: proxy
  ports:
  - name: name-of-service-port
    protocol: TCP
    port: 80
    targetPort: http-web-svc 

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels: 
    app.kubernetes.io/name: proxy
spec:
  containers:
  - name: nginx 
    image: nginx:stable 
    ports:
    - containerPort: 80
      name: http-web-svc
    resources:
      requests:
        memory: "128Mi"
        cpu: "250m"
      limits: 
        memory: "256Mi"
        cpu: "500m"